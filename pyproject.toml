[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopear"
version = "0.1.0"
description = "Compact iterative evidence-grounded auditory perception model"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6.0,<2.7.0",
    "torchaudio>=2.6.0,<2.7.0",
    "huggingface-hub==0.29.3",
    "datasets==3.3.2",
    "safetensors==0.5.3",
    "soundfile==0.13.1",
    "numpy==2.2.4",
    "scipy==1.15.2",
    "scikit-learn==1.6.1",
    "aiohttp==3.11.16",
    "pyarrow>=18.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pyflakes==3.3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loopear*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
